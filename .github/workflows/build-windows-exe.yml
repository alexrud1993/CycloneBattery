name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/windows-exe-build

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build solution
        run: dotnet build -c Release --no-restore

      - name: Test
        continue-on-error: true
        run: dotnet test -c Release --no-build --no-restore

      - name: Publish self-contained EXE
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CycloneBattery-win-x64
          path: src/CycloneBattery.App/bin/Release/net10.0-windows/win-x64/publish/**
          if-no-files-found: error
          retention-days: 30
